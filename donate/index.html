<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <script>try{if(!sessionStorage.getItem("ahatab-intro")&&!matchMedia("(prefers-reduced-motion: reduce)").matches)document.documentElement.classList.add("intro-pending")}catch(e){}</script>
  <title>Donate | Ahatab Foundation</title>
  <meta name="description" content="Donate to Ahatab Foundation with bKash, Nagad, Rocket or Upay. Contact Ahatab Foundation in Faridpur, Bangladesh.">
  <link rel="icon" href="../favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://esm.sh" crossorigin>
  <link rel="preconnect" href="https://adxorsgrowtfpxysugvl.supabase.co" crossorigin>
  <link rel="modulepreload" href="https://esm.sh/@supabase/supabase-js@2">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600&family=Tiro+Bangla&family=Young+Serif&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/site.css">
</head>
<body data-title="meta.donate">
  <a class="skip" href="#main" data-i18n="skip"></a>
  <header id="site-header"></header>
  <main id="main">
    <div class="wrap page-head has-art">
      <div class="page-head-text">
        <h1 data-i18n="donate.title"></h1>
        <p class="lede" data-i18n="donate.lede"></p>
        <div class="stitch stitch-short"></div>
      </div>
      <figure class="page-art"><img data-slot="donate" alt="" width="1200" height="800" decoding="async"></figure>
    </div>
    <section class="section" style="padding-top:.5rem">
      <div class="wrap">
        <div class="gate">
          <ol class="gate-steps" id="gate-steps" aria-label="Steps">
            <li data-s="1"><span>1</span><b data-i18n="donate.s1"></b></li>
            <li data-s="2"><span>2</span><b data-i18n="donate.s2"></b></li>
            <li data-s="3"><span>3</span><b data-i18n="donate.s3"></b></li>
          </ol>
          <div id="gate-body" class="gate-body"></div>
        </div>
        <p class="gate-safe" data-i18n="donate.safe"></p>
      </div>
    </section>
  </main>
  <footer id="site-footer"></footer>
  <script type="module" src="../js/donate.js"></script>
</body>
</html>
