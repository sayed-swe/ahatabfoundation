<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <script>try{if(!sessionStorage.getItem("ahatab-intro")&&!matchMedia("(prefers-reduced-motion: reduce)").matches)document.documentElement.classList.add("intro-pending")}catch(e){}</script>
  <title>About us | Ahatab Foundation</title>
  <meta name="description" content="Why Ahatab Foundation began in Faridpur in 2026, what we believe and how we work.">
  <link rel="icon" href="../favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://esm.sh" crossorigin>
  <link rel="preconnect" href="https://adxorsgrowtfpxysugvl.supabase.co" crossorigin>
  <link rel="modulepreload" href="https://esm.sh/@supabase/supabase-js@2">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600&family=Tiro+Bangla&family=Young+Serif&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/site.css">
</head>
<body data-title="meta.about">
  <a class="skip" href="#main" data-i18n="skip"></a>
  <header id="site-header"></header>
  <main id="main">
    <div class="wrap page-head has-art">
      <div class="page-head-text">
        <h1 data-i18n="about.title"></h1>
        <p class="lede" data-i18n="about.lede"></p>
        <div class="stitch stitch-short"></div>
      </div>
      <figure class="page-art"><img data-slot="about" alt="" width="1200" height="800" decoding="async"></figure>
    </div>

    <section class="section section-white">
      <div class="wrap split">
        <h2 data-i18n="about.story.title"></h2>
        <div>
          <p data-i18n="about.story.p1"></p>
          <p data-i18n="about.story.p2"></p>
        </div>
      </div>
    </section>

    <section class="section">
      <div class="wrap split">
        <h2 data-i18n="about.mission.title"></h2>
        <div>
          <p style="font-family:var(--serif);font-size:1.5rem;line-height:1.4" data-i18n="about.mission.body"></p>
          <h3 data-i18n="about.approach.title" style="margin-top:2rem"></h3>
          <ul class="steps">
            <li data-i18n="about.approach.1"></li>
            <li data-i18n="about.approach.2"></li>
            <li data-i18n="about.approach.3"></li>
          </ul>
        </div>
      </div>
    </section>

    <section class="section section-white">
      <div class="wrap">
        <h2 data-i18n="about.values.title"></h2>
        <ul class="values">
          <li><h3 data-i18n="about.v1.t"></h3><p data-i18n="about.v1.d"></p></li>
          <li><h3 data-i18n="about.v2.t"></h3><p data-i18n="about.v2.d"></p></li>
          <li><h3 data-i18n="about.v3.t"></h3><p data-i18n="about.v3.d"></p></li>
          <li><h3 data-i18n="about.v4.t"></h3><p data-i18n="about.v4.d"></p></li>
        </ul>
      </div>
    </section>

    <section class="section">
      <div class="wrap split">
        <h2 data-i18n="about.where.title"></h2>
        <p data-i18n="about.where.body"></p>
      </div>
    </section>

    <section class="band">
      <div class="wrap">
        <h2 data-i18n="cta.title"></h2>
        <div class="btn-row">
          <a class="btn btn-sun" href="../donate/" data-i18n="cta.donate"></a>
          <a class="btn btn-ghost" href="../volunteer/" data-i18n="cta.volunteer"></a>
        </div>
      </div>
    </section>
  </main>
  <footer id="site-footer"></footer>
  <script type="module" src="../js/about.js"></script>
</body>
</html>
