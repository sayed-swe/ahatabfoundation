<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Get involved | Ahatab Foundation</title>
  <meta name="description" content="Donate, volunteer or spread the word for Ahatab Foundation in Faridpur, Bangladesh.">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600&family=Tiro+Bangla&family=Young+Serif&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/site.css">
</head>
<body data-title="meta.involved">
  <a class="skip" href="#main" data-i18n="skip"></a>
  <header id="site-header"></header>
  <main id="main">
    <div class="wrap page-head">
      <h1 data-i18n="involved.title"></h1>
      <p class="lede" data-i18n="involved.lede"></p>
      <div class="stitch stitch-short"></div>
    </div>

    <section class="section" id="give" style="padding-top:1rem;scroll-margin-top:1rem">
      <div class="wrap">
        <h2 data-i18n="give.title"></h2>
        <div class="two-col">
          <div>
            <p id="give-step"></p>
            <div id="methods"></div>
          </div>
          <div class="panel">
            <h3 data-i18n="give.form.title"></h3>
            <p class="muted" data-i18n="give.note"></p>
            <form id="give-form" class="form-grid" novalidate>
              <div class="field"><label for="g-name" data-i18n="form.name"></label><input id="g-name" name="name" required maxlength="120" autocomplete="name"></div>
              <div class="field"><label for="g-amount" data-i18n="form.amount"></label><input id="g-amount" name="amount" required inputmode="decimal" autocomplete="off"></div>
              <div class="field"><label for="method" data-i18n="form.method"></label><select id="method" name="method"></select></div>
              <div class="field"><label for="g-trx"><span data-i18n="form.trx"></span> <span class="opt" data-i18n="form.optional"></span></label><input id="g-trx" name="trx" maxlength="80" autocomplete="off"></div>
              <div class="field"><label for="g-phone"><span data-i18n="form.phone"></span> <span class="opt" data-i18n="form.optional"></span></label><input id="g-phone" name="phone" type="tel" maxlength="40" autocomplete="tel"></div>
              <div class="field"><label for="g-msg"><span data-i18n="form.message"></span> <span class="opt" data-i18n="form.optional"></span></label><textarea id="g-msg" name="message" maxlength="1000" style="min-height:90px"></textarea></div>
              <div class="hp" aria-hidden="true"><label>Website <input name="website" tabindex="-1" autocomplete="off"></label></div>
              <p class="form-status" role="status"></p>
              <div><button class="btn btn-teal" type="submit" data-i18n="give.submit"></button></div>
            </form>
          </div>
        </div>
      </div>
    </section>

    <section class="section section-white" id="volunteer" style="scroll-margin-top:1rem">
      <div class="wrap two-col">
        <div>
          <h2 data-i18n="vol.title"></h2>
          <p data-i18n="vol.lede"></p>
        </div>
        <form id="vol-form" class="form-grid" novalidate>
          <div class="field"><label for="v-name" data-i18n="form.name"></label><input id="v-name" name="name" required maxlength="120" autocomplete="name"></div>
          <div class="field"><label for="v-phone" data-i18n="form.phone"></label><input id="v-phone" name="phone" type="tel" required maxlength="40" autocomplete="tel"></div>
          <div class="field"><label for="v-email"><span data-i18n="form.email"></span> <span class="opt" data-i18n="form.optional"></span></label><input id="v-email" name="email" type="email" maxlength="200" autocomplete="email"></div>
          <div class="field">
            <label for="v-area" data-i18n="vol.area"></label>
            <select id="v-area" name="area">
              <option data-i18n="vol.a.logistics" value="Distribution and logistics"></option>
              <option data-i18n="vol.a.health" value="Health and first aid"></option>
              <option data-i18n="vol.a.teaching" value="Teaching and mentoring"></option>
              <option data-i18n="vol.a.fund" value="Fundraising"></option>
              <option data-i18n="vol.a.media" value="Photos, video and design"></option>
              <option data-i18n="vol.a.other" value="Something else"></option>
            </select>
          </div>
          <div class="field"><label for="v-msg"><span data-i18n="form.message"></span> <span class="opt" data-i18n="form.optional"></span></label><textarea id="v-msg" name="message" maxlength="3000"></textarea></div>
          <div class="hp" aria-hidden="true"><label>Website <input name="website" tabindex="-1" autocomplete="off"></label></div>
          <p class="form-status" role="status"></p>
          <div><button class="btn btn-teal" type="submit" data-i18n="vol.submit"></button></div>
        </form>
      </div>
    </section>

    <section class="section">
      <div class="wrap split">
        <h2 data-i18n="spread.title"></h2>
        <div>
          <p data-i18n="spread.body"></p>
          <button class="btn btn-ghost" type="button" id="share" data-i18n="share.copy"></button>
        </div>
      </div>
    </section>
  </main>
  <footer id="site-footer"></footer>
  <script type="module" src="js/involved.js"></script>
</body>
</html>
